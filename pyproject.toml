[project]
name = "meshcore-bitwig-bridge"
version = "0.1.0"
description = "Forward MeshCore companion-radio messages to MIDI for Bitwig Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcore>=2.0",
    "mido[ports-rtmidi]>=0.9.2",
]

[project.scripts]
meshcore-bitwig-bridge = "meshcore_bitwig_bridge.cli:main"
meshcore-send = "meshcore_bitwig_bridge.sender:main"
meshcore-listen = "meshcore_bitwig_bridge.listener:main"
meshcore-name = "meshcore_bitwig_bridge.namer:main"
meshcore-advert = "meshcore_bitwig_bridge.adverter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshcore_bitwig_bridge"]

# Project on an external volume: uv cache (~/.cache/uv) cannot hardlink across filesystems.
[tool.uv]
link-mode = "copy"
